/* Cinematic aviation intelligence visual refresh */
:root{
 --navy:#242832;--blue:#3e596b;--blue2:#e9e7e8;--ink:#252932;--muted:#737782;
 --line:#e4e0e2;--bg:#e9e6e8;--white:#f8f7f7;--green:#397b69;--green-bg:#e5efeb;
 --amber:#a66a24;--amber-bg:#f5eadb;--red:#a94b4b;--red-bg:#f5e5e4;
 --gray:#69717a;--gray-bg:#eeedef;--shadow:0 12px 36px rgba(38,35,42,.07);--radius:18px
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',Arial,sans-serif;letter-spacing:-.01em}
.sidebar{background:#e2dfe2;color:#333640;border-right:1px solid #d5d1d5;box-shadow:8px 0 30px rgba(30,28,34,.025)}
.brand{border-bottom:1px solid #cbc7cc}
.brandmark{background:#2a2d35;color:#f7f5f6;border-radius:50%;font-size:13px}
.brand strong{color:#282b34;letter-spacing:.07em}
.brand small,.navlabel,.sidebottom{color:#777982}
.nav button{color:#555a64;border-radius:12px;margin:3px 0}
.nav button:hover{background:#d7d3d8;color:#272b34}
.nav button.active{background:#2b2e37;color:#fff;box-shadow:0 5px 14px #25283220}
.rolepill{background:#d3d0d5;color:#4a4d57}
.main{background:linear-gradient(145deg,#eeebed 0%,#e7e4e7 55%,#e9e6e8 100%)}
.topbar{background:rgba(246,244,245,.78);backdrop-filter:blur(18px);border-bottom:1px solid #dedade}
.content{max-width:1600px;padding:30px 34px 60px}
.card,.metric{background:rgba(250,249,249,.88);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:var(--shadow)}
.metric{padding:20px;min-height:118px}
.metric .value{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:-.045em}
.h1{font-family:Manrope,sans-serif;letter-spacing:-.055em;font-weight:600}
.eyebrow,.label,.navlabel{letter-spacing:.12em;text-transform:uppercase}
.btn{border-radius:999px;border-color:#d9d5d9;background:#f7f5f6}
.btn.primary{background:#292d36;border-color:#292d36;color:white}
.field,select{border-radius:12px;background:#fbfafa;border-color:#ddd9dd}
.banner{border-radius:16px;background:#f4eee5;border:1px solid #eadcc8}
.mapcell{border-radius:14px;background:#f7f5f6;border:1px solid #e3dfe2}
.mapcell:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.modal{border-radius:22px}
.mobile-nav{background:rgba(246,244,245,.94);backdrop-filter:blur(15px)}
.mobile-nav button{border-radius:999px;background:#f7f5f6}
.mobile-nav button.active{background:#292d36}
.cinematic-hero{position:relative;isolation:isolate;overflow:hidden;min-height:390px;margin:4px 0 22px;padding:34px 38px;border-radius:26px;
 background:radial-gradient(ellipse at 70% 48%,#c9c1c2 0%,#d8d2d5 32%,#dedade 65%,#e9e6e8 100%);
 border:1px solid #ffffffa8;display:grid;grid-template-columns:minmax(240px,.85fr) minmax(300px,1.15fr);align-items:center;gap:20px}
.cinematic-hero:before{content:"";position:absolute;z-index:-1;width:min(46vw,490px);aspect-ratio:1;right:7%;top:50%;transform:translateY(-50%);
 border-radius:50%;background:
 radial-gradient(circle at 50% 50%,#fff9d8 0 2%,#f6a33c 3%,#d77a2d 6%,transparent 15%),
 repeating-conic-gradient(from 4deg at 50% 50%,#f7f5f3 0deg 1deg,#aaa7ad 1.3deg 1.9deg,transparent 2deg 4.5deg);
 filter:drop-shadow(0 18px 28px #6e5a5630);animation:orbfloat 12s ease-in-out infinite}
.cinematic-hero:after{content:"";position:absolute;z-index:-1;width:min(50vw,540px);aspect-ratio:1;right:5%;top:50%;transform:translateY(-50%);border-radius:50%;
 background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 34px,#fff8 35px 36px,transparent 37px 43px);
 mask-image:radial-gradient(circle,transparent 0 32%,#000 33% 70%,transparent 72%);opacity:.5;animation:orbit 36s linear infinite}
.hero-copy{max-width:460px;position:relative;z-index:1}
.hero-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#65636b;font-weight:700}
.hero-title{font:600 clamp(30px,4vw,54px)/1.03 Manrope,sans-serif;letter-spacing:-.065em;color:#292c35;margin:16px 0}
.hero-desc{font-size:14px;line-height:1.65;color:#666873;max-width:390px}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.hero-actions button{border:1px solid #c9c4ca;background:#f8f6f7;border-radius:999px;padding:10px 16px;color:#343741;font-weight:600}
.hero-actions button:first-child{background:#292d36;color:#fff;border-color:#292d36}
.hero-orb-label{position:absolute;right:4%;bottom:18px;font-size:9px;letter-spacing:.16em;color:#6f6b73;text-transform:uppercase}
@keyframes orbfloat{0%,100%{transform:translateY(-50%) rotate(0deg) scale(.98)}50%{transform:translateY(-51%) rotate(8deg) scale(1.03)}}
@keyframes orbit{to{transform:translateY(-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.cinematic-hero:before,.cinematic-hero:after{animation:none}.mapcell:hover{transform:none}}
@media(max-width:720px){
 .content{padding:17px 13px 36px}.cinematic-hero{min-height:460px;padding:24px 20px;grid-template-columns:1fr;align-content:start}
 .cinematic-hero:before{width:300px;right:50%;top:auto;bottom:-75px;transform:translateX(50%);animation:none}
 .cinematic-hero:after{width:330px;right:50%;top:auto;bottom:-90px;transform:translateX(50%);animation:none}
 .hero-copy{max-width:100%}.hero-title{font-size:34px}.hero-orb-label{right:15px;bottom:12px}

function overview(){let role=D.roleCounts,coverage= D.countries.map(c=>({c,ratio:c.scoredWithEvidence/90}));let alerts=[['red','⚑','Review queue needs triage',`${D.reviews.length} rows are listed for analyst review; queue approval status is not represented in the workbook.`,'review'],['amber','↗','Evidence gaps recorded',`${n(role.Gap)} gap rows mark searches where evidence was not found. They are not zero-valued results.`,'matrix'],['amber','⟳','Outstanding information requests',`${D.requests.length} request templates are available. Individual requests have no live workflow status in this workbook.`,'requests'],['blue','⌁','Potential broken or stale links',`${n(D.sources.length)} catalogue entries need checks; workbook URL notes are not automated live link tests.`,'sources'],['amber','⇄','Potential conflicts and mappings',`${D.reviews.length} review-queue rows include candidate records; conflict categories and mapping decisions require reviewer confirmation.`,'review'],['gray','◷','Overdue requests not determined',`Request templates have no per-request due dates or sent states, so overdue requests cannot be identified from this workbook.`,'requests']];document.getElementById('screen-overview').innerHTML=page('EVIDENCE-FIRST VIEW','Aviation readiness, with the evidence in view','Explore collected aviation-system information across countries. Evidence quantity, completeness and assessed performance are kept separate.',`<button class="btn" onclick="go('methodology')">How results work</button><button class="btn primary" onclick="go('matrix')">Explore evidence</button>`)+`<section class="cinematic-hero" aria-label="Aviation intelligence introduction">

c"><div class="label">Data request templates</div><div class="value">${D.requests.length}</div><div class="hint">Outstanding sent requests not recorded</div></div></div><div class="layout2"><div>${card('Evidence coverage by country','Indicators with at least one logged fact, out of 90 scored indicators. This is coverage—not performance.',`<div class="filters"><label for="countrySearch" class="smallnote">Find a country</label><input class="field" id="countrySearch" placeholder="Search by country or code" oninput="filterCountries(this.value)">${selCountries('countryFilter','changeCountry(this.value)')}<button class="btn small" onclick="go(\'matrix\')">Open evidence matrix →</button></div><div class="mapgrid" role="group" aria-label="Country coverage tile map: each tile shows scored indicators with any logged evidence out of 90; not a geographic map">${coverage.map(({c,ratio})=>`<button class="mapcell" data-state="${ratio>=.4?'strong':ratio>=.3?'medium':ratio>=.2?'low':'thin'}" onclick="openProfile('${c.code}')"><strong>${c.code} · ${esc(c.name)}</strong><small>${c.scoredWithEvidence} / 90 indicators with evidence</small></button>`).join('')}</div><div class="legend"><span>Coverage colour key: ≥40% / 30–39% / 20–29% / &lt;20%</span><span>Country tile map (schematic, not geographic)</span><span>Coverage only—not performance</span><span>All values have a table alternative below</span></div><div class="tablewrap" style="margin-top:12px"><table id="countryTable"><thead><tr><th>Country</th><th>Group</th><th>Scored indicators with evidence</th><th>Facts logged</th><th>Evidence gaps</th><th>Sources</th></tr></thead><tbody>${coverage.map(({c,ratio})=>`<tr class="countryrow" data-search="${esc((c.name+' '+c.code).toLowerCase())}"><td><button class="btn ghost small" onclick="openProfile('${c.code}')">${esc(c.name)} <span class="secondary">${c.code}</span></button></td><td>${c.group.includes('Comparator')?pill('Comparator','blue'):pill('ASECNA member','gray')}</td><td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:100px"><i style="width:${Math.round(ratio*100)}%"></i></div><b>${c.scoredWithEvidence}/90</b></div></td><td>${n(c.facts)}</td><td>${n(c.gaps)}</td><td>${n(c.sources)}</td></tr>`).join('')}</tbody></table></div><div class="smallnote" style="margin-top:9px">Workbook-derived counts. A scored-indicator evidence count does not mean an approved score exists.</div>`)}${card('What each evidence symbol means','Accessible status labels are provided alongside colour.',`<div class="keygrid"><div class="kitem"><b>● Direct</b>Direct evidence</div><div class="kitem"><b>◒ Supporting</b>Supporting evidence</div><div class="kitem"><b>▧ Context</b>Context only</div><div class="kitem"><b>∅ Gap</b>Searched, not found</div></div><p class="smallnote">A blank means no record; it is never displayed as a numerical zero.</p>`)}</div><div>${card('Needs attention','Items surfaced from the workbook; verify operational status before acting.',alerts.map(a=>`<div class="alertitem"><div class="alertglyph ${a[0]}">${a[1]}</div><div><strong>${a[2]}</strong><p>${a[3]}</p><button class="btn ghost small" onclick="go('${a[4]}')">Review →</button></div></div>`).join(''))}${card('Find a country','Go straight to a country evidence profile.',`<div class="filters">${selCountries('overviewCountry','openProfile(this.value)')}<button class="btn primary" onclick="openProfile(document.getElementById('overviewCountry').value)">View profile</button></div><div class="focus-note">Rwanda and Kenya are comparator countries outside ASECNA. Their group label is explicit in the workbook.</div>`)}</div></div>`}

function profile(){let c=D.countries.find(x=>x.code===selectedCountry)||D.countries[1],s=D.summary[c.code]||{},has=s.composite!==null&&s.composite!==undefined,scored=s.scoredIndicators??null,weight=s.weightCovered??null;let scoredPillars=D.pillars.filter(p=>s[p.code]!==null&&s[p.code]!==undefined);let evidence=recs(c.name);let indrows=D.indicators.filter(i=>i.pillar!=='X').map(i=>{let rr=recs(c.name,i.id);let scoreRow=null;let score=null,grade=null; if(c.code==='KEN'){const found=D.scoreNotes.find(x=>x.country==='Kenya'&&x.indicatorId===i.id); if(found){score=found.score;grade=found.grade;scoreRow=found}}let r=rr.find(x=>x.role==='Direct')||rr[0];return {i,rr,r,score,grade,scoreRow}}).filter(x=>x.rr.length).slice(0,13);document.getElementById('screen-profile').innerHTML=page('COUNTRY PROFILE',`${esc(c.name)} <span style="font-size:15px;color:#6b7b89">${c.code}</span>`,`${esc(c.group)} · ${evidence.filter(x=>x.role!=='Gap').length} facts logged plus ${c.gaps} searched gaps. This profile separates evidence coverage from performance.`,`${selCountries('profileCountry','openProfile(this.value)')}<button class="btn" onclick="window.print()">Print / PDF</button><button class="btn" onclick="exportCountryCSV('${c.name}')">Export CSV</button><button class="btn primary" onclick="go('matrix')">Open evidence matrix</button>`)+`<div class="banner"><span class="bicon">ⓘ</span><div><strong>Workbook snapshot · approval version not confirmed.</strong> All result values below are reproduced from the workbook where present. Missing scores remain “Not assessed”. Evidence presence does not itself verify a claim or make a result publishable. Click any displayed indicator score for its workbook note and related evidence.</div></div><div class="layout2"><div><div class="card"><div class="countryhero"><div class="flagmark">${c.code}</div><div><div class="eyebrow">${esc(c.group)}</div><h2 class="cardtitle" style="font-size:20px">${esc(c.name)}</h2><div class="cardsub">Safety EI band (mid-2024 e from score and performance.',`<div class="barrow"><span>Indicators with evidence</span><div class="bar"><i style="width:${Math.round(c.scoredWithEvidence/90*100)}%"></i></div><span class="pct">${c.scoredWithEvidence}/90</span></div><div class="statrow"><div class="statbox"><b>${n(c.facts)}</b><span>Facts logged, excluding gaps</span></div><div class="statbox"><b>${n(c.direct)}</b><span>Direct facts</span></div><div class="statbox"><b>${n(c.gaps)}</b><span>Searched, not found</span></div><div class="statbox"><b>${n(c.sources)}</b><span>Sources catalogued</span></div></div><p class="smallnote">Coverage counts evidence presence, not quality or sufficiency. Provider counts are catalogue entries, not necessarily confirmed active providers.</p>`)}${card('Service-provider catalogue counts','Workbook counts only; not an endorsement or live validation.',`<div class="statrow"><div class="statbox"><b>${c.handling??'—'}</b><span>Ground handling</span></div><div class="statbox"><b>${c.fuel??'—'}</b><span>Fuel entries</span></div><div class="statbox"><b>${c.catering??'—'}</b><span>Catering</span></div><div class="statbox"><b>${c.fbo??'—'}</b><span>FBO</span></div><div class="statbox"><b>${c.mroAirport??'—'}</b><span>MRO airport-level</span></div><div class="statbox"><b>${c.mroOrg??'—'}</b><span>MRO organisations</span></div><div class="statbox"><b>${c.training??'—'}</b><span>Flight training</span></div></div>`)}</div></div>${card('Indicators with logged evidence','A result is shown only where the workbook contains a score; every record can be opened to inspect its source and next step.',`<div class="tablewrap"><table><thead><tr><th>Indicator</th><th>Result</th><th>Evidence grade</th><th>Evidence record</th><th>Period / accessed</th><th>Next action</th></tr></thead><tbody>${indrows.map(({i,rr,r,score,grade})=>`<tr><td><button class="btn ghost small" onclick="openIndicator('${i.id}')"><b>${i.id}</b> ${esc(i.name)}</button><span class="secondary">${esc(i.pillarName)}</span></td><td>${score===null?'Not assessed':`<button class="btn small" onclick="openScore('${i.id}')">${score} / 5 · trace</button><span class="secondary">Workbook draft${grade==='B'&&score>=4?' · source rule needs review':''}</span>`}</td><td>${grade?pill('Grade '+grade,grade==='A'?'green':'amber'):pill(r?.grade?'Grade '+r.grade:'No grade',r?.grade==='A'?'green':'gray')}</td><td>${r?`<button class="btn small" onclick="openEvidence('${r.dataId}','${r.sheet.slice(0,3)}')">${r.dataId} · ${esc(r.role)}</button>`:'—'}</td><td>${r?`${esc(r.period)}<span class="secondary">Accessed ${esc(r.accessed)}</span>`:'—'}</td><td>${r?esc((r.notes||'Review source and completeness').slice(0,90)):'No record'}</td></tr>`).join('')}</tbody></table></div>`)}${card('Score evidence trail','For any scored indicator, follow the score to its evidence records and source catalogue. Current approvals are not established by the workbook.',`<div class="focus-note">Score trace: assessment → approved evidence records → linked source(s) → calculation version. This prototype links record and source IDs. The workbook does not identify a published approval/version record.</div>`)} `}
function openScore(id){let note=D.scoreNotes.find(x=>x.country==='Kenya'&&x.indicatorId===id);if(!note)return;let rs=recs('Kenya',id);document.getElementById('modalEyebrow').textContent='Workbook score note · approval not confirmed';document.getElementById('modalTitle').textContent=id+' · '+note.indicator;document.getElementById('modalBody').innerHTML=`<div class="banner"><span class="bicon">⚠</span><div><strong>Working score, not a published assessment.</strong> The workbook does not identify an approved calculation version or verified score-to-evidence links. Related records below are candidates for review, not approved citations.</div></div><div class="detailgrid"><div class="detailfield"><span>Saved score / evidence grade</span><b>${note.score} / 5 · grade ${esc(note.grade)}</b></div><div class="detailfield"><span>Source note</span><b>${esc(note.sheet)} · row ${note.row}</b></div></div><div class="detailfield"><span>Score reasoning in workbook</span><b>${esc(note.reason)}</b></div><p class="smallnote">Grade B scores of 4 or 5 require at least one A-grade source or two B-grade sources. Evidence-grade caps and source independence must be checked by a reviewer.</p><h3>Evidence with the same country and indicator</h3>${rs.length?renderEvidenceRows(rs):'<div class="empty"><b>No related evidence records</b>Trace must be completed before publishing.</div>'}`;document.getElementById('modalback').classList.add('open')}

function renderEvidenceRows(rs){return `<div class="tablewrap"><table><thead><tr><th>Data ID</th><th>Country / indicator</th><th>Data point / value</th><th>Period</th><th>Grade · completeness</th><th>Role</th><th>Source</th><th>Next step</th></tr></thead><tbody>${rs.map(r=>`<tr><td><button class="btn ghost small" onclick="openEvidence('${r.dataId}','${r.sheet.slice(0,3)}')">${esc(r.dataId)}</button><span class="secondary">${esc(r.sheet)} · row ${r.row}</span></td><td>${esc(r.country)}<span class="secondary">${esc(r.indicatorId)}</span></td><td>${esc(r.dataPoint)}<span class="secondary">${esc(r.value)} ${esc(r.unit)}</span></td><td>${esc(r.period)}</td><td>${r.grade?pill('Grade '+r.grade,r.grade==='A'?'green':r.grade==='B'?'blue':'amber'):pill('Not graded','gray')} ${pill(r.completeness||'Unknown',r.completeness==='Yes'?'green':r.completeness==='Partial'?'amber':'gray')}</td><td>${pill(r.role,r.role==='Direct'?'green':r.role==='Gap'?'amber':r.role==='Context'?'gray':'blue')}</td><td>${r.sourceId?`<button class="btn small" onclick="openSource('${r.country}','${r.sourceId}')">${esc(r.sourceId)}</button>`:'No linked source'}${r.sourceUrl?`<span class="secondary"><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">Open link ↗</a></span>`:''}</td><td>${esc((r.notes||'—').slice(0,120))}</td></tr>`).join('')}</tbody></table></div>`}
function evidence(){document.getElementById('screen-evidence').innerHTML=page('EVIDENCE BROWSER','Inspect every recorded fact','Search and filter the source workbook’s evidence log. Each row preserves its source link, role, completeness, notes and original sheet-row reference.',`<button class="btn" onclick="exportEvidenceCSV()">Download filtered CSV</button>`)+`<div class="banner"><span class="bicon">ⓘ</span><div><strong>1,818 evidence log rows include 146 gaps.</strong> Gap rows mean searched but not found; they are never counted as evidence facts or converted to zero-valued observations.</div></div><div class="card"><div class="filters"><input class="field" id="evSearch" placeholder="Search text, ID, value, notes…" oninput="filterEvidence()"><select id="evCountry" class="select" onchange="filterEvidence()"><option value="">All countries</option>${D.countries.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="evRole" class="select" onchange="filterEvidence()"><option value="">All roles</option>${['Direct','Supporting','Context','Gap'].map(x=>`<option>${x}</option>`).join('')}</select><select id="evGrade" class="select" onchange="filterEvidence()"><option value="">All grades</option>${['A','B','C','D','X'].map(x=>`<option>${x}</option>`).join('')}</select><select id="evCompleteness" class="select" onchange="filterEvidence()"><option value="">All completeness</option><option>Yes</option><option>Partial</option><option>No</option></select><select id="evPillar" class="select" onchange="filterEvidence()"><option value="">All pillars</option>${D.pillars.map(p=>`<option value="${p.code}">${p.code} · ${esc(p.name)}</option>`).join('')}</select><select id="evSource" class="select" onchange="filterEvidence()"><option value="">All sources</option>${D.sources.map(x=>`<option value="${esc(x.country+'::'+x.id)}">${esc(x.country)} · ${esc(x.id)} · ${esc(x.title)}</option>`).join('')}</select><select id="evDate" class="select" onchange="filterEvidence()"><option value="">All access dates</option>${[...new Set(D.records.map(x=>x.accessed).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="evReview" class="select" onchange="filterEvidence()"><option value="">All review states</option><option value="queued">In review queue</option><option value="notqueued">Not in review queue</option></select><button class="btn small" onclick="resetEvidence()">Reset filters</button><span class="smallnote" id="evCount"></span></div><div id="evTable"></div></div>`;filterEvidence()}
function filterEvidence(){if(!document.getElementById('evSearch'))return;let q=document.getElementById('evSearch').value.toLowerCase(),c=document.getElementById('evCountry').value,role=document.getElementById('evRole').value,g=document.getElementById('evGrade').value,comp=document.getElementById('evCompleteness').value,p=document.getElementById('evPillar').value,source=document.getElementById('evSource').value,date=document.getElementById('evDate').value,review=document.getElementById('evReview').value;let a=D.records.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!c||r.country===c)&&(!role||r.role===role)&&(!g||r.grade===g)&&(!comp||r.completeness===comp)&&(!p||D.indicators.find(i=>i.id===r.indicatorId)?.pillar===p)&&(!source||r.country+'::'+r.sourceId===source)&&(!date||r.accessed===date)&&(!review||((review==='queued')===D.reviews.some(x=>x.country===r.country&&x.dataId===r.dataId))));window.filteredEvidence=a;document.getElementById('evCount').textContent=`Showing ${Math.min(a.length,60)} of ${n(a.length)} matches`;document.getElementById('evTable').innerHTML=a.length?renderEvidenceRows(a.slice(0,60)):`<div class="empty"><b>No records match these filters</b>Try removing a filter or broadening your search.</div>`}
function resetEvidence(){['evSearch','evCountry','evRole','evGrade','evCompleteness','evPillar','evSource','evDate','evReview'].forEach(x=>document.getElementById(x).value='');filterEvidence()}
function sources(){document.getElementById('screen-sources').innerHTML=page('SOURCE LIBRARY','A catalogue of the material behind the records','Browse source references by country, publisher, title, indicator and evidence grade. Link checks shown here are workbook validation notes, not live checks.',`<button class="btn" onclick="go('evidence')">Browse evidence</button>`)+`<div class="banner"><span class="bicon">⚠</span><div><strong>Source catalogue entries: ${n(D.sources.length)}.</strong> A source’s listed grade and URL status are descriptive workbook fields. This prototype does not claim that any link is currently live.</div></div><div class="card"><div class="filters"><input id="srcSearch" class="field" placeholder="Search title, publisher, indicator or URL" oninput="filterSources()"><select id="srcCountry" class="select" onchange="filterSources()"><option value="">All countries</option>${D.countries.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="srcGrade" class="select" onchange="filterSources()"><option value="">All grades</option>${['A','B','C','D'].map(x=>`<option>${x}</option>`).join('')}</select><select id="srcType" class="select" onchange="filterSources()"><option value="">All source types</option>${[...new Set(D.sources.map(x=>x.type).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><input id="srcDate" class="field" placeholder="Filter access / publication date" oninput="filterSources()"><span class="smallnote" id="srcCount"></span></div><div id="srcTable"></div></div>`;filterSources()}
function filterSources(){if(!document.getElementById('srcSearch'))return;let q=document.getElementById('srcSearch').value.toLowerCase(),c=document.getElementById('srcCountry').value,g=document.getElementById('srcGrade').value,t=document.getElementById('srcType').value,date=document.getElementById('srcDate').value.toLowerCase();let a=D.sources.filter(s=>(!q||JSON.stringify(s).toLowerCase().includes(q))&&(!c||s.country===c)&&(!g||s.grade===g)&&(!t||s.type===t)&&(!date||`${s.update||''} ${s.access||''} ${s.title||''}`.toLowerCase().includes(date)));document.getElementById('srcCount').textContent=`${n(a.length)} matching source entries`;document.getElementById('srcTable').innerHTML=a.length?`<div class="tablewrap"><table><thead><tr><th>Source</th><th>Country</th><th>Publisher / type</th><th>Publication / access</th><th>Indicators</th><th>Grade / validation</th><th>Related records</th></tr></thead><tbody>${a.slice(0,70).map(s=>`<tr><td><button class="btn ghost small" onclick="openSource('${s.country}','${s.id}')"><b>${esc(s.id)} · ${esc(s.title)}</b></button><span class="secondary">${esc(s.description||'').slice(0,150)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Open source ↗</a></td><td>${esc(s.country)}</td><td>${esc(s.publisher)}<span class="secondary">${esc(s.type)}</span></td><td>${esc(s.update||'—')}<span class="secondary">Access: ${esc(s.access||'—')}</span></td><td>${esc(s.indicators||'—')}</td><td>${pill(s.grade?'Grade '+s.grade:'Not graded',s.grade==='A'?'green':'blue')}<span class="secondary">${esc(s.validation||'Unvalidated')}</span></td><td>${s.rowsCiting??'—'} source-log citations</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>No sources found</b>Adjust the search or filters.</div>`}
function openSource(country,id){let s=D.sources.find(x=>x.country===country&&x.id===id);if(!s)return;document.getElementById('modalEyebrow').textContent='Source catalogue · '+s.country;document.getElementById('modalTitle').textContent=s.id+' · '+s.title;let linked=D.records.filter(r=>r.country===s.country&&r.sourceId===s.id);document.getElementById('modalBody').innerHTML=`<div class="detailgrid">${[['Publisher',s.publisher],['Country scope',s.country],['Source type',s.type],['Publication date','Not separately recorded'],['Publication / update note',s.update],['Access',s.access],['Archive / cached copy','Not separately recorded'],['Validation status',s.validation],['URL',`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)} ↗</a>`],['Related indicators',s.indicators],['Workbook reference',s.sheet+' · row '+s.row],['Related evidence records',linked.length]].map(([a,b])=>`<div class="detailfield"><span>${a}</span><b>${typeof b==='string'&&b.startsWith('<a')?b:esc(b)}</b></div>`).join('')}</div><p class="smallnote">${esc(s.description)} ${esc(s.notes||'')}</p><h3>Linked evidence records (${linked.length})</h3>${linked.length?renderEvidenceRows(linked.slice(0,12)):'<div class="empty"><b>No linked evidence rows</b></div>'}`;document.getElementById('modalback').classList.add('open')}
function indicators(){document.getElementById('screen-indicators').innerHTML=page('INDICATOR EXPLORER','Explore how each indicator is defined','The workbook contains ten weighted pillars and an unweighted context category. Find measurement rules, suggested sources, country coverage and related records.',`<button class="btn" onclick="go('matrix')">Open evidence matrix</button>`)+`<div class="card"><div class="filters"><input id="indicatorSearch" class="field" placeholder="Search ID, name or definition" oninput="renderIndicatorsTable()"><select id="indPillar" class="select" onchange="renderIndicatorsTable()"><option value="">All pillars</option>${D.pillars.map(p=>`<option value="${p.code}">${p.code} · ${esc(p.name)}</option>`).join('')}</select><select id="indCountry" class="select" onchange="renderIndicatorsTable()"><option value="">All countries</option>${D.countries.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><select id="indCore" class="select" onchange="renderIndicatorsTable()"><option value="">Core and non-core</option><option>Y</option><option>N</option></select><select id="indLens" class="select" onchange="renderIndicatorsTable()"><option value="">All lenses</option>${['Capability','Implementation','Outcome','Context'].map(x=>`<option>${x}</option>`).join('')}</select><select id="indGrade" class="select" onchange="renderIndicatorsTable()"><option value="">Any evidence grade</option>${['A','B','C','D','X'].map(x=>`<option>${x}</option>`).join('')}</select><select id="indRole" class="select" onchange="renderIndicatorsTable()"><option value="">All evidence roles</option>${['Direct','Supporting','Context','Gap'].map(x=>`<option>${x}</option>`).join('')}</select><select id="indComplete" class="select" onchange="renderIndicatorsTable()"><option value="">All completeness states</option>${['Yes','Partial','No'].map(x=>`<option>${x}</option>`).join('')}</select><select id="indSourceType" class="select" onchange="renderIndicatorsTable()"><option value="">All source types</option>${[...new Set(D.sources.map(x=>x.type).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="indPeriod" class="select" onchange="renderIndicatorsTable()"><option value="">All observation periods</option>${[...new Set(D.records.map(x=>x.period).filter(Boolean))].sort().slice(0,40).map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="indReview" class="select" onchange="renderIndicatorsTable()"><option value="">All review states</option><option value="queued">In review queue</option><option value="notqueued">Not in review queue</option></select></div><span id="indCount" class="smallnote"></span><div id="indTable" style="margin-top:10px"></div></div>`;renderIndicatorsTable()}
function renderIndicatorsTable(force){if(!document.getElementById('indicatorSearch'))return;let q=(force||document.getElementById('indicatorSearch').value).toLowerCase(),p=document.getElementById('indPillar').value,c=document.getElementById('indCountry').value,core=document.getElementById('indCore').value,lens=document.getElementById('indLens').value,grade=document.getElementById('indGrade').value,role=document.getElementById('indRole').value,complete=document.getElementById('indComplete').value,sourceType=document.getElementById('indSourceType').value,period=document.getElementById('indPeriod').value,review=document.getElementById('indReview').value;let a=D.indicators.filter(i=>{let rr=recs(c||null,i.id);return (!q||JSON.stringify(i).toLowerCase().includes(q))&&(!p||i.pillar===p)&&(!core||i.core===core)&&(!lens||i.lens===lens)&&(!c||rr.length)&&(!grade||rr.some(r=>r.grade===grade))&&(!role||rr.some(r=>r.role===role))&&(!complete||rr.some(r=>r.completeness===complete))&&(!period||rr.some(r=>r.period===period))&&(!sourceType||rr.some(r=>D.sources.some(x=>x.country===r.country&&x.id===r.sourceId&&x.type===sourceType)))&&(!review||rr.some(r=>{let queued=D.reviews.some(x=>x.country===r.country&&x.dataId===r.dataId);return review==='queued'?queued:!queued}))});document.getElementById('indCount').textContent=`${a.length} indicators`;document.getElementById('indTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>ID / indicator</th><th>Pillar · weight</th><th>Core · lens</th><th>Definition / measure</th><th>Unit / direction</th><th>Framework</th><th>Evidence footprint</th></tr></thead><tbody>${a.map(i=>`<tr><td><button class="btn ghost small" onclick="showIndicator('${i.id}')"><b>${i.id} · ${esc(i.name)}</b></button></td><td>${i.pillar} · ${esc(i.pillarName)}<span class="secondary">Pillar weight ${i.weight}%</span></td><td>${i.core==='Y'?pill('Core','blue'):pill('Non-core','gray')}<span class="secondary">${esc(i.lens)}</span></td><td>${esc(i.measure)}</td><td>${esc(i.unit)}<span class="secondary">Better: ${esc(i.better)}</span></td><td>${esc(i.framework)}</td><td>${n(i.facts)} facts · ${i.countries} countries<span class="secondary">${recs(null,i.id).length} log rows</span></td></tr>`).join('')}</tbody></table></div>`}
function showIndicator(id){let i=D.indicators.find(x=>x.id===id);if(!i)return;let r=D.records.filter(x=>x.indicatorId===id);document.getElementById('modalEyebrow').textContent='Indicator definition · '+i.pillarName;document.getElementById('modalTitle').textContent=i.id+' · '+i.name;document.getElementById('modalBody').innerHTML=`<div class="detailgrid">${[['Pillar',i.pillar+' · '+i.pillarName+' · weight '+i.weight+'%'],['Core',i.core==='Y'?'Core indicator':'Non-core'],['Lens',i.lens],['How measured',i.measure],['Unit / direction',i.unit+' · '+i.better],['Framework reference',i.framework],['Expected access / likely availability',i.access+' · '+i.availability],['Facts / countries',i.facts+' fact entries · '+i.countries+' countries']].map(([a,b])=>`<div class="detailfield"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div><h3>Sources to check</h3><p><b>National:</b> ${esc(i.national)}</p><p><b>International / secondary:</b> ${esc(i.international)}</p><h3>Related evidence records (${r.length})</h3>${r.length?renderEvidenceRows(r.slice(0,10)):'<div class="empty"><b>No evidence record is linked</b>Missing evidence is not a score of zero.</div>'}<div class="hr"></div><button class="btn" onclick="closeModal();go('requests')">View related data request templates</button>`;document.getElementById('modalback').classList.add('open')}
function matrix(){let codes=D.countries.map(c=>c.code);document.getElementById('screen-matrix').innerHTML=page('COVERAGE MATRIX','What evidence do we have?','Cells describe evidence presence, role and completeness—not performance scores. Click a status to inspect its records and sources.',`<button class="btn" onclick="exportCoverageCSV()">Download CSV</button>`)+`<div class="banner"><span class="bicon">ⓘ</span><div><strong>Coverage is not performance.</strong> “No evidence” and “Searched, but no evidence found” are different states. Symbols, labels and patterns supplement colour.</div></div><div class="card"><div class="filters"><input id="matrixSearch" class="field" placeholder="Filter indicators" oninput="filterMatrix()"><select id="matrixPillar" class="select" onchange="filterMatrix()"><option value="">All pillars</option>${D.pillars.map(p=>`<option value="${p.code}">${p.code} · ${esc(p.name)}</option>`).join('')}</select><select id="matrixCountry" class="select" onchange="filterMatrix()"><option value="">All countries</option>${D.countries.map(c=>`<option value="${c.code}">${esc(c.name)}</option>`).join('')}</select><span class="smallnote">97 indicator rows · table scrolls horizontally</span></div><div class="legend"><span><i class="swatch" style="background:#f6f8fa"></i>— No evidence</span><span>∅ Searched, not found</span><span>▧ Context only</span><span>◒ Supporting</span><span>● Direct</span><span>✓ Complete direct</span><span>◐ Partial</span><span>! Needs review</span></div><div class="tablewrap" style="margin-top:12px"><table class="matrix"><thead><tr id="matrixHead"><th>Indicator</th>${codes.map(code=>`<th data-code="${code}" title="${esc(D.countries.find(c=>c.code===code).name)}">${code}</th>`).join('')}<th>Total facts</th><th>Direct facts</th><th>Gaps</th><th>Source entries</th><th>Country coverage</th></tr></thead><tbody id="matrixBody"></tbody></table></div><div class="hr"></div><h3 class="cardtitle">Country-level coverage totals</h3><p class="smallnote">Workbook facts excluding gap rows. “Scored indicators with evidence” is not a count of approved scores.</p><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th scope="col">Country</th><th scope="col">Facts (excl. gaps)</th><th scope="col">Direct facts</th><th scope="col">Gaps</th><th scope="col">Source entries</th><th scope="col">Scored indicators with evidence</th><th scope="col">Evidence coverage</th></tr></thead><tbody>${D.countries.map(c=>`<tr><th scope="row">${esc(c.name)} (${c.code})</th><td>${n(c.facts)}</td><td>${n(c.direct)}</td><td>${n(c.gaps)}</td><td>${n(c.sources)}</td><td>${c.scoredWithEvidence}/90</td><td>${Math.round(c.scoredWithEvidence/90*100)}%</td></tr>`).join('')}</tbody></table></div></div>`;renderMatrix()}
function renderMatrix(){let b=document.getElementById('matrixBody');if(!b)return;let q=document.getElementById('matrixSearch').value.toLowerCase(),p=document.getElementById('matrixPillar').value,csel=document.getElementById('matrixCountry').value;document.querySelectorAll('#matrixHead [data-code]').forEach(x=>x.style.display=csel&&x.dataset.code!==csel?'none':'');let a=D.indicators.filter(i=>(!q||i.id.toLowerCase().includes(q)||i.name.toLowerCase().includes(q))&&(!p||i.pillar===p));b.innerHTML=a.map(i=>{let cells=D.countries.map(c=>{let st=cellState(c.name,i);return `<td style="${csel&&c.code!==csel?'display:none':''}"><button class="statuscell ${st.cls}" aria-label="${esc(c.name)}, ${i.id}: ${st.label}" title="${esc(c.name)} · ${st.label}" onclick="openMatrixCell('${c.name}','${i.id}')">${st.txt}</button></td>`}).join('');let all=D.countries.flatMap(c=>recs(c.name,i.id)),facts=all.filter(x=>x.role!=='Gap').length,direct=all.filter(x=>x.role==='Direct').length,gaps=all.filter(x=>x.role==='Gap').length,sources=new Set(all.filter(x=>x.sourceId).map(x=>x.country+'::'+x.sourceId)).size,coverage=D.countries.filter(c=>recs(c.name,i.id).some(x=>x.role!=='Gap')).length;return `<tr><th scope="row" class="indcell"><b>${i.id}</b> ${esc(i.name)}<span class="secondary">${esc(i.pillarName)} · ${i.core==='Y'?'Core':'Non-core'}</span></th>${cells}<td>${facts}</td><td>${direct}</td><td>${gaps}</td><td>${sources}</td><td>${Math.round(coverage/D.countries.length*100)}%</td></tr>`}).join('')}
function cellState(country,i){let rr=recs(country,i.id);if(!rr.length)return {cls:'none',txt:'—',label:'No evidence'};if(D.reviews.some(x=>x.country===country&&rr.some(r=>r.dataId===x.dataId)))return {cls:'review',txt:'!',label:'Needs review'};let non=rr.filter(r=>r.role!=='Gap'), gaps=rr.filter(r=>r.role==='Gap');if(!non.length)return {cls:'gap',txt:'∅',label:'Searched, but no evidence found'};if(non.every(r=>r.role==='Context'))return {cls:'ctx',txt:'▧',label:'Context only'};if(non.some(r=>r.completeness==='Partial'))return {cls:'partial',txt:'◐',label:'Partial evidence'};if(non.some(r=>r.role==='Direct'&&r.completeness==='Yes'))return {cls:'complete',txt:'✓',label:'Complete direct evidence'};if(non.some(r=>r.role==='Direct'))return {cls:'direct',txt:'●',label:'Direct evidence'};if(non.some(r=>r.role==='Supporting'))return {cls:'support',txt:'◒',label:'Supporting evidence'};return {cls:'partial',txt:'◐',label:gaps.length?'Partial evidence':'Evidence logged'}}
function renderMatrix(){let b=document.getElementById('matrixBody');if(!b)return;let q=document.getElementById('matrixSearch').value.toLowerCase(),p=document.getElementById('matrixPillar').value,csel=document.getElementById('matrixCountry').value;document.querySelectorAll('#matrixHead [data-code]').forEach(x=>x.style.display=csel&&x.dataset.code!==csel?'none':'');let a=D.indicators.filter(i=>(!q||i.id.toLowerCase().includes(q)||i.name.toLowerCase().includes(q))&&(!p||i.pillar===p));b.innerHTML=a.map(i=>{let rowCountries=D.countries;let cells=rowCountries.map(c=>{let s=cellState(c.name,i);return `<td style="${csel&&c.code!==csel?'display:none':''}"><button class="statuscell ${s.cls}" aria-label="${esc(c.name)}, ${i.id}: ${s.label}" title="${esc(c.name)} · ${s.label}" onclick="openMatrixCell('${c.name}','${i.id}')">${s.txt}</button></td>`}).join('');let all=D.countries.flatMap(c=>recs(c.name,i.id)),fact=all.filter(x=>x.role!=='Gap').length,direct=all.filter(x=>x.role==='Direct').length,gaps=all.filter(x=>x.role==='Gap').length,sourceCt=new Set(all.filter(x=>x.sourceId).map(x=>x.country+'::'+x.sourceId)).size,cov=D.countries.filter(cc=>recs(cc.name,i.id).some(x=>x.role!=='Gap')).length;return `<tr><td class="indcell"><b>${i.id}</b> ${esc(i.name)}<span class="secondary">${esc(i.pillarName)} · ${i.core==='Y'?'Core':'Non-core'}</span></td>${cells}<td>${fact}</td><td>${direct}</td><td>${gaps}</td><td>${sourceCt}</td><td>${Math.round(cov/D.countries.length*100)}%</td></tr>`}).join('')}
function filterMatrix(){renderMatrix()}
function openMatrixCell(country,id){let i=D.indicators.find(x=>x.id===id),r=recs(country,id);document.getElementById('modalEyebrow').textContent=country+' · '+id+' · '+i.pillarName;document.getElementById('modalTitle').textContent=i.name;document.getElementById('modalBody').innerHTML=`<p>${r.length?`${r.length} log row(s) for this country and indicator.`:'No evidence is recorded for this country-indicator pair. This is not a score of zero.'}</p>${r.length?renderEvidenceRows(r):'<div class="empty"><b>No evidence logged</b>Next: check the indicator’s suggested sources or create a data request.</div>'}<div class="hr"></div><button class="btn" onclick="closeModal();go('requests')">Open request templates</button>`;document.getElementById('modalback').classList.add('open')}
function compare(){document.getElementById('screen-compare').innerHTML=page('COUNTRY COMPARISON','Compare only when the basis matches','Select countries, indicators, a matching period and unit, an approved calculation version, and a minimum evidence threshold before interpreting values.',`<button class="btn" onclick="go('methodology')">Comparison rules</button>`)+`<div class="banner"><span class="bicon">⚠</span><div><strong>No comparison is enabled yet.</strong> The workbook contains no approved calculation-version identifier. Country ranking is intentionally not offered.</div></div><div class="card"><h2 class="cardtitle">Set a fair comparison basis</h2><div class="filters"><label>Country A ${selCountries('cmpA','syncCompareOptions()')}</label><label>Country B <select id="cmpB" class="select" onchange="syncCompareOptions()">${D.countries.map(c=>`<option value="${c.code}" ${c.code==='RWA'?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Indicator <select id="cmpInd" class="select" onchange="syncCompareOptions()"><option value="">Select an indicator</option>${D.indicators.filter(i=>i.pillar!=='X').map(i=>`<option value="${i.id}">${i.id} · ${esc(i.name)}</option>`).join('')}</select></label><label>Matching observation period <select class="select" id="cmpPeriod" onchange="validateCompare()"><option value="">Choose countries and indicator first</option></select></label><label>Matching unit <select class="select" id="cmpUnit" onchange="validateCompare()"><option value="">Choose countries and indicator first</option></select></label><label>Approved calculation version <select class="select" id="cmpVersion" onchange="validateCompare()"><option value="">No approved version identified</option></select></label><label>Minimum evidence threshold <select class="select" id="cmpThreshold" onchange="validateCompare()"><option value="">Select threshold</option><option>At least Grade B</option><option>At least one direct record</option><option>Complete direct evidence, Grade A/B</option></select></label></div><p id="cmpGate" class="focus-note">Candidate periods and units will be derived only from records for the selected countries and indicator. The workbook has no approved calculation version, so comparisons remain blocked.</p><button class="btn primary" id="cmpRun" disabled onclick="runCompare()">Show comparable values</button><div id="cmpOutput" class="disabledchart">No values shown: an approved calculation version and verified comparable observations are not available.</div></div><div class="card"><h2 class="cardtitle">Why comparisons may be blocked</h2><p class="smallnote">Sources may cover different periods, countries may lack direct evidence, units may differ, or a score may be provisional. Blocking a comparison is safer than implying comparability.</p><div class="tablewrap"><table><thead><tr><th>Requirement</th><th>Current workbook status</th><th>What is needed</th></tr></thead><tbody><tr><td>Approved calculation version</td><td>${pill('Not identified','amber')}</td><td>Reviewer-approved version and effective date</td></tr><tr><td>Matching observation period</td><td>${pill('Check selected records','amber')}</td><td>Same period and recency rule for each country</td></tr><tr><td>Minimum evidence threshold</td><td>${pill('Needs user selection','gray')}</td><td>Evidence-grade and completeness rule</td></tr></tbody></table></div></div>`;syncCompareOptions()}
function syncCompareOptions(){let a=document.getElementById('cmpA')?.value,b=document.getElementById('cmpB')?.value,id=document.getElementById('cmpInd')?.value,period=document.getElementById('cmpPeriod'),unit=document.getElementById('cmpUnit');if(!period||!unit)return;let records=(country)=>D.records.filter(r=>r.country===D.countries.find(c=>c.code===country)?.name&&r.indicatorId===id&&r.role==='Direct'&&r.period&&r.unit);let ar=records(a),br=records(b),commonPeriods=[...new Set(ar.map(r=>r.period).filter(v=>br.some(x=>x.period===v)))],commonUnits=[...new Set(ar.map(r=>r.unit).filter(v=>br.some(x=>x.unit===v)))];period.innerHTML='<option value="">'+(commonPeriods.length?'Select matching period':'No identical direct-evidence period found')+'</option>'+commonPeriods.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');unit.innerHTML='<option value="">'+(commonUnits.length?'Select matching unit':'No identical direct-evidence unit found')+'</option>'+commonUnits.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');validateCompare()}
function validateCompare(){let exists=['cmpInd','cmpPeriod','cmpUnit','cmpThreshold'].every(id=>document.getElementById(id)?.value),same=document.getElementById('cmpA')?.value!==document.getElementById('cmpB')?.value,version=Boolean(document.getElementById('cmpVersion')?.value);let button=document.getElementById('cmpRun'),gate=document.getElementById('cmpGate');if(button)button.disabled=!(exists&&same&&version);if(gate)gate.textContent=!same?'Choose two different countries.':!document.getElementById('cmpPeriod')?.options?.length||document.getElementById('cmpPeriod')?.options?.length<2?'No identical direct-evidence period is available for the current selection. No comparison can be made.':!version?'Matching direct-evidence periods/units are shown only when present; however, the workbook has no approved calculation version. The comparison gate remains closed.':'All inputs selected; final server-side validation and reviewer-approved version are still required.'}
function runCompare(){toast('Comparison blocked: no approved calculation version is available in this workbook.');}
function review(){let q=D.reviews.slice(0,40);document.getElementById('screen-review').innerHTML=page('REVIEW WORKSPACE','Check records before they affect results','Review queue items, mapping questions and evidence changes. Only approved records should feed published results; the workbook provides a queue but no authoritative live status.',`<button class="btn" onclick="go('evidence')">Open evidence browser</button>`)+`<div class="banner"><span class="bicon">⚠</span><div><strong>${D.reviews.length} review queue rows in workbook.</strong> These are candidates to review—not approved assessments. Queue statuses and audit events need to be recorded in the platform.</div></div><p class="smallnote">Proposed workflow for future live requests; templates below have no recorded operational state.</p><div class="progresssteps"><span class="step">Draft</span><span class="step-arrow">›</span><span class="step">In review</span><span class="step-arrow">›</span><span class="step">Changes requested</span><span class="step-arrow">›</span><span class="step">Approved</span><span class="step-arrow">›</span><span class="step">Published</span><span class="step-arrow">›</span><span class="step">Superseded</span></div><div class="metrics"><div class="metric"><div class="label">Queue rows</div><div class="value">${D.reviews.length}</div><div class="hint">Workbook Review_Queue</div></div><div class="metric"><div class="label">Mapping issues</div><div class="value">Needs review</div><div class="hint">Review individual mapping basis</div></div><div class="metric"><div class="label">Inferred classifications</div><div class="value">6</div><div class="hint">Check against original reference</div></div><div class="metric"><div class="label">Approval state</div><div class="value" style="font-size:18px">Not recorded</div><div class="hint">Do not publish from this queue alone</div></div></div><div class="layout3" style="margin-bottom:14px"><div class="metric"><div class="label">Mapping</div><div class="value" style="font-size:16px">Review candidates</div><div class="hint">Inspect original code and mapping basis per record</div></div><div class="metric"><div class="label">Conflicts / outdated sources</div><div class="value" style="font-size:16px">Verify individually</div><div class="hint">Workbook has no normalized conflict/expiry state</div></div><div class="metric"><div class="label">Missing links / score-cap issues</div><div class="value" style="font-size:16px">Reviewer check</div><div class="hint">No automated URL check or approval outcome is recorded</div></div></div><div class="card"><div class="filters"><input class="field" id="reviewSearch" placeholder="Search country, ID, indicator or data point" oninput="filterReview()"><select class="select" id="reviewConf" onchange="filterReview()"><option value="">All confidence</option><option>High</option><option>Medium</option><option>Low</option></select></div><div id="reviewTable"></div></div><div class="card"><h2 class="cardtitle">Review checklist</h2><div class="layout3"><div class="detailfield"><span>Evidence</span><b>Confirm source, access date, period and whether direct or supporting.</b></div><div class="detailfield"><span>Mapping</span><b>Retain original team code, original data ID and mapping basis.</b></div><div class="detailfield"><span>Scoring</span><b>Apply grade caps and source-count rule before approval.</b></div></div></div>`;filterReview()}
function filterReview(){if(!document.getElementById('reviewSearch'))return;let q=document.getElementById('reviewSearch').value.toLowerCase(),c=document.getElementById('reviewConf').value,a=D.reviews.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!c||x.confidence===c));document.getElementById('reviewTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Country</th><th>Record / indicator</th><th>Data point</th><th>Confidence</th><th>Workbook ref</th><th>Workflow</th></tr></thead><tbody>${a.slice(0,60).map(x=>`<tr><td>${esc(x.country)}</td><td><button class="btn small" onclick="openEvidence('${x.dataId}','${D.countries.find(c=>c.name===x.country)?.code||''}')">${esc(x.dataId)}</button> · ${esc(x.indicator)}</td><td>${esc(x.dataPoint)}</td><td>${pill(x.confidence,x.confidence==='High'?'green':x.confidence==='Low'?'amber':'blue')}</td><td>${x.sheet} · row ${x.row}</td><td>${pill('Status not recorded','gray')} <button class="btn small" onclick="toast('Workflow actions are shown in this prototype; no record was changed.')">Review</button></td></tr>`).join('')}</tbody></table></div>`}
function requests(){document.getElementById('screen-requests').innerHTML=page('DATA REQUEST TRACKER','Turn missing information into a follow-up','Workbook templates cover information needs such as current USOAP results, security audits, staffing, inspections, certification and navigation data.',`<button class="btn primary" onclick="toast('Request draft form opened in prototype.')">＋ Create request</button>`)+`<div class="banner"><span class="bicon">ⓘ</span><div><strong>Templates are not live requests.</strong> The workbook has ${D.requests.length} request templates but no per-country sent, response or due-date state. This view makes that distinction explicit.</div></div><p class="smallnote">Proposed workflow for future live requests; templates below have no recorded operational state.</p><div class="progresssteps"><span class="step">Draft</span><span class="step-arrow">›</span><span class="step">Sent</span><span class="step-arrow">›</span><span class="step">Follow-up needed</span><span class="step-arrow">›</span><span class="step">Response received</span><span class="step-arrow">›</span><span class="step">Evidence linked</span><span class="step-arrow">›</span><span class="step">Closed</span></div><div class="card"><div class="filters"><input class="field" id="reqSearch" placeholder="Search template or indicator" oninput="filterRequests()"><select id="reqPri" class="select" onchange="filterRequests()"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><div id="reqTable"></div></div>`;filterRequests()}
function filterRequests(){if(!document.getElementById('reqSearch'))return;let q=document.getElementById('reqSearch').value.toLowerCase(),p=document.getElementById('reqPri').value,a=D.requests.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!p||x.priority===p));document.getElementById('reqTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Request template</th><th>Indicators</th><th>Typical addressee</th><th>Suggested channel</th><th>Priority</th><th>Operational status</th><th>Linked evidence</th></tr></thead><tbody>${a.map(x=>`<tr><td><b>${esc(x.id)}</b> · ${esc(x.title)}</td><td>${esc(x.indicators)}</td><td>${esc(x.addressee)}</td><td>${esc(x.channel)}</td><td>${pill(x.priority,x.priority==='High'?'red':'amber')}</td><td>${pill('Template only','gray')}<span class="secondary">No live request status</span></td><td><button class="btn small" onclick="go('evidence')">Find linked record</button></td></tr>`).join('')}</tbody></table></div>`}
function methodology(){document.getElementById('screen-methodology').innerHTML=page('METHODOLOGY','How to read the evidence and results','A plain-language guide to the workbook framework. This page explains rules, caveats and what a displayed result does—and does not—mean.',`<button class="btn" onclick="toast('Correction / challenge form opened in prototype.')">Challenge or correct a result</button>`)+`<div class="banner"><span class="bicon">ⓘ</span><div><strong>This is a readiness and evidence framework, not a safety certification or country league table.</strong> Sparse information can mean low public availability—not low aviation performance.</div></div><div class="layout2"><div>${card('What the platform measures','Ten weighted pillars; one unweighted context category.',`<p>The workbook organizes indicators across governance and policy, safety oversight, security and facilitation, capacity and funding, market access and consumers, airports, air navigation, air cargo, environment, and bankability and readiness.</p><div class="tablewrap"><table><thead><tr><th>Pillar</th><th>Assessment area</th><th>Weight</th></tr></thead><tbody>${D.pillars.map(p=>`<tr><td>${p.code}</td><td>${esc(p.name)}</td><td>${p.weight}%</td></tr>`).join('')}<tr><td>X</td><td>Context indicators · not scored</td><td>0%</td></tr></tbody></table></div><p class="smallnote">The workbook lists 90 scored indicators and 7 context indicators. Pillar weights total 100% across the ten scored pillars.</p>`)}${card('What it does not measure','Limits that should travel with every result.',`<ul><li>It is not a direct measure of aviation safety outcomes or proof of regulatory effectiveness.</li><li>Publicly available documents do not always show implementation in practice.</li><li>A missing source or data point does not imply poor performance.</li><li>Country comparisons are unsafe without matching indicator, period, unit, minimum evidence threshold and approved version.</li><li>A historical reference value must not be presented as current.</li></ul>`)}${card('Safety gate and result interpretation','The workbook includes a gate and a limit for results where a gate applies.',`<p>The scoring workbook records whether a safety gate applies and includes a rule holding an index at 74 where applicable. Review the underlying indicators and score notes before interpreting that rule. The prototype does not invent or recalculate a gate result.</p><p>Performance bands shown by the framework: Critical from 0; Developing from 40; Functional from 60; Strong from 75; Leading from 90. These are result bands, not evidence-quality grades.</p>`)}</div><div>${card('Evidence grades and highest score allowed','A lower grade limits the score even when a claim looks positive.',`<div class="tablewrap"><table><thead><tr><th>Grade</th><th>Highest score allowed</th><th>Meaning in workflow</th></tr></thead><tbody><tr><td>${pill('A','green')}</td><td>5</td><td>Strong primary evidence</td></tr><tr><td>${pill('B','blue')}</td><td>5</td><td>Reliable evidence; score 4 or 5 requires one A-grade source or two B-grade sources</td></tr><tr><td>${pill('C','amber')}</td><td>3</td><td>Score cannot exceed 3</td></tr><tr><td>${pill('D','amber')}</td><td>2</td><td>Score cannot exceed 2</td></tr><tr><td>${pill('X','gray')}</td><td>1</td><td>Score cannot exceed 1</td></tr></tbody></table></div>`)}${card('Evidence roles and completeness',null,`<div class="keygrid"><div class="kitem"><b>Direct</b>Informs an assessment</div><div class="kitem"><b>Supporting</b>Supports context or interpretation</div><div class="kitem"><b>Context</b>Background / normaliser; unscored</div><div class="kitem"><b>Gap</b>Searched, but not found; never a fact</div></div><div class="hr"></div><p><b>Partial</b> means the source only addresses part of an indicator; do not present a partial result as complete. <b>Not assessed</b> means there is no score. <b>Withheld</b> means a score exists but must not be published until conditions are met. <b>Capped</b> means the grade limits the maximum score.</p>`)}${card('Date limitations and version history',null,`<p>Workbook evidence was accessed on varying dates, including 21 November 2026. The safety EI country bands refer to an ICAO AFI report from mid-2024. Each record carries its own observation period and access date. Show historical reference values as historical.</p><div class="detailfield"><span>Source workbook</span><b>Source workbook · record access dates vary</b></div><div class="detailfield" style="margin-top:8px"><span>Calculation / methodology version</span><b>Not identified as an approved publication version</b></div>`)}${card('How to challenge or correct a result',null,`<ol><li>Open the indicator and its evidence trail.</li><li>Point to the claim, period, unit, or source that needs correction.</li><li>Submit a new source or supporting document, preserving the original record.</li><li>A reviewer checks the change and logs the decision and rationale.</li><li>Approved corrections create a new calculation and import version; prior versions remain auditable.</li></ol>`)}</div></div>`}
function importPage(){document.getElementById('screen-import').innerHTML=page('ADMINISTRATION','Import a new workbook safely','Upload, validate, map, preview and approve a new source version. The current prototype demonstrates the workflow; it does not upload, persist or change data.',`<button class="btn" onclick="toast('Rollback selection is a prototype control; no version was changed.')">Version history / rollback</button>`)+`<div class="banner"><span class="bicon">⚠</span><div><strong>Administrator-only workflow.</strong> Uploading alone must never publish changes. Keep the original import, display exact sheet and cell errors, preserve row references, and require review and approval before published results change.</div></div><div class="progresssteps"><span class="step current">1 · Upload</span><span class="step-arrow">›</span><span class="step">2 · Validate</span><span class="step-arrow">›</span><span class="step">3 · Mapping review</span><span class="step-arrow">›</span><span class="step">4 · Preview changes</span><span class="step-arrow">›</span><span class="step">5 · Approval</span><span class="step-arrow">›</span><span class="step">6 · Publish</span></div><div class="layout2"><div><div class="card"><h2 class="cardtitle">1. Upload workbook</h2><div class="uploadzone"><div style="font-size:28px;color:#4d85aa">⇧</div><b>Choose an .xlsx file to validate</b><p class="smallnote">No file leaves your device in this prototype.</p><input type="file" id="fileInput" accept=".xlsx,.xlsm" aria-label="Choose workbook file" onchange="previewFile(this)"><div id="fileFeedback" class="smallnote" style="margin-top:9px"></div></div></div>${card('2. Sheet-by-sheet validation','Required workbook sheets and structural checks.',`<div class="tablewrap"><table><thead><tr><th>Check</th><th>Rule</th><th>Example error shown</th><th>State</th></tr></thead><tbody><tr><td>Required sheets</td><td>Register, coverage, scoring, profiles, requests, review, sources and country logs</td><td>Missing sheet: Coverage_Matrix</td><td>${pill('Ready to validate','gray')}</td></tr><tr><td>Indicator IDs</td><td>Unique and mapped to register</td><td>Scoring_Matrix!A18 · unknown ID Z9</td><td>${pill('Not run','gray')}</td></tr><tr><td>Country code</td><td>Must match country profile</td><td>RWA Log!B12 · unknown country code</td><td>${pill('Not run','gray')}</td></tr><tr><td>Grade / role</td><td>Allowed values only; gap is not a fact</td><td>KEN Log!I24 · invalid grade</td><td>${pill('Not run','gray')}</td></tr></tbody></table></div>`)}${card('3. Mapping review','Preserve original codes and document mapping basis.',`<div class="focus-note">Proposed fields: source workbook version, original sheet and row, original indicator code, canonical indicator ID, mapping basis, audit note, reviewer and approval status.</div>`)}</div><div>${card('4. Preview changes','Diff before any data is committed.',`<div class="statrow"><div class="statbox"><b>—</b><span>Records to create</span></div><div class="statbox"><b>—</b><span>Records to update</span></div><div class="statbox"><b>—</b><span>Records to retire</span></div><div class="statbox"><b>—</b><span>Conflicts</span></div></div><p class="smallnote">Counts appear after file validation. No unverified counts are fabricated in this static mock-up.</p><button class="btn" disabled>Preview import changes</button>`)}${card('5. Approval & version comparison',null,`<div class="detailfield"><span>Current workbook</span><b>Source workbook · draft preview</b></div><div class="detailfield" style="margin-top:8px"><span>Proposed import version</span><b>Created after validation; requires reviewer approval</b></div><div class="detailfield" style="margin-top:8px"><span>Rollback</span><b>Restore a previous approved import and calculation version</b></div><div class="hr"></div><button class="btn" onclick="toast('Approval gate: reviewer authorization required.')">Request reviewer approval</button>`)}${card('Interface state gallery','Reusable states for loading, errors, permissions and missing information.',`<div class="layout3"><div class="detailfield"><span>Loading</span><b>Loading evidence records… Preserve layout; announce status politely.</b></div><div class="detailfield"><span>Error</span><b>Could not validate the workbook. Check the listed sheet and cell; the original file is unchanged.</b></div><div class="detailfield"><span>Restricted access</span><b>Administrator permission required. Ask an administrator; do not expose restricted data.</b></div><div class="detailfield"><span>No data</span><b>No evidence is recorded. This is not a score of zero. Check suggested sources or create a request.</b></div><div class="detailfield"><span>Partial</span><b>Evidence covers part of the indicator. Do not interpret it as complete.</b></div><div class="detailfield"><span>Success</span><b>Import validated. Nothing publishes until an authorized reviewer approves.</b></div></div>`)}${card('Audit log','Every transition must be traceable.',`<p class="smallnote">Record who imported, reviewed, approved, published or rolled back a version; timestamp; file hash; changed records; validation outcome; decision reason; and prior/new version identifiers.</p>`)}</div></div>`}
function kit(){document.getElementById('screen-kit').innerHTML=page('DESIGN SYSTEM','UI kit and interaction states','Shared components, tokens and accessible interaction patterns for the desktop, tablet and mobile experience.',`<button class="btn" onclick="go('overview')">Back to overview</button>`)+`<div class="layout2"><div>${card('Buttons, controls and filters','Primary, secondary, disabled and focus styles.',`<div class="actions"><button class="btn primary" onclick="toast('Example button activated')">Primary action</button><button class="btn">Secondary action</button><button class="btn" disabled>Disabled action</button></div><div class="filters"><label>Search<br><input class="field" placeholder="Search evidence"></label><label>Country<br><select class="select"><option>All countries</option><option>Kenya</option></select></label><label>Period<br><input class="field" placeholder="YYYY"></label></div><div class="smallnote">Focus controls with Tab. Avoid relying on colour, hover or placeholder text as labels.</div>`)}${card('Evidence and workflow badges','Use explicit words alongside status colours.',`<div class="actions">${pill('Not assessed','gray')} ${pill('Score withheld','amber')} ${pill('Score capped','amber')} ${pill('Partial','amber')} ${pill('Complete','green')} ${pill('Direct','green')} ${pill('Supporting','blue')} ${pill('Context','gray')} ${pill('Searched, not found','amber')} ${pill('Inferred','amber')} ${pill('Historical','gray')} ${pill('Needs review','red')} ${pill('Approved','green')}</div>`)}${card('Data table and evidence chart','A text value and table accompany every visual.',`<div class="barrow"><span>Indicators with evidence</span><div class="bar"><i style="width:42%"></i></div><span class="pct">38/90</span></div><div class="tablewrap"><table><thead><tr><th scope="col">Country</th><th scope="col">Evidence footprint</th><th scope="col">Meaning</th></tr></thead><tbody><tr><th scope="row">Kenya</th><td>38 / 90</td><td>Indicators with any fact; not span><b>No evidence logged. This is not a score of zero.</b></div>`)}${card('Notifications and forms','Short, direct, actionable.',`<div class="focus-note">Information: this is a workbook-derived draft, not an approved calculation.</div><div class="banner" style="margin-top:10px"><span>⚠</span><div><strong>Review required.</strong> Confirm the source and observation period before publication.</div></div><label>Request owner<br><input class="field" placeholder="Select an owner"></label><p class="smallnote">Validation error: Enter an owner before sending this request.</p>`)}</div></div>`}
function previewFile(input){let x=input.files[0];document.getElementById('fileFeedback').textContent=x?`${x.name} · ${n(x.size)} bytes · upload not executed in prototype`:''}
function openEvidence(id,code){let r=D.records.find(x=>x.dataId===id && x.sheet.startsWith(code+' '));if(!r)return;let i=D.indicators.find(x=>x.id===r.indicatorId),source=D.sources.find(s=>s.country===r.country&&s.id===r.sourceId);document.getElementById('modalEyebrow').textContent='Evidence record · '+r.country+' · '+r.sheet+' row '+r.row;document.getElementById('modalTitle').textContent=r.dataId+' · '+(r.dataPoint||'Untitled data point');document.getElementById('modalBody').innerHTML=`<div class="detailgrid">${[['Country',r.country],['Indicator',r.indicatorId+' · '+(i?.name||'Unknown indicator')],['Data point',r.dataPoint],['Value / unit',r.value+' '+r.unit],['Observation period',r.period],['Evidence grade',r.grade||'Not graded'],['Completeness',r.completeness],['Role',r.role],['Access date',r.accessed],['Source ID',r.sourceId||'No source ID'],['Source URL',r.sourceUrl?`<a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">Open original source ↗</a>`:'Not supplied'],['Workbook row',r.sheet+' · row '+r.row],['Original code',r.originalCode],['Original data ID',r.originalDataId],['Mapping basis',r.mappingBasis],['Reviewer / approval',r.reviewer||'Not recorded']].map(([a,b])=>`<div class="detailfield"><span>${a}</span><b>${typeof b==='string'&&b.startsWith('<a')?b:esc(b)}</b></div>`).join('')}</div><div class="detailfield"><span>Notes and next step</span><b>${esc(r.notes)}</b></div><div class="detailfield" style="margin-top:8px"><span>Audit note</span><b>${esc(r.auditNote||'No separate audit note in the workbook')}</b></div><div class="hr"></div><h3>Source / change history</h3>${source?`<p><button class="btn" onclick="openSource('${r.country}','${r.sourceId}')">${esc(source.id)} · ${esc(source.title)} — source details</button></p>`:'<p class="smallnote">No linked source catalogue record found.</p>'}<div class="focus-note">Workbook reference is preserved for traceability. The workbook does not contain an application-level immutable change-history log; do not infer an approval from the record’s presence.</div>`;document.getElementById('modalback').classList.add('open')}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function csvEscape(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function downloadCSV(name,rows){let data=rows.map(r=>r.map(csvEscape).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('CSV downloaded.')}
function exportEvidenceCSV(){downloadCSV('aviation-evidence-filtered.csv',[['Data ID','Country','Indicator','Data point','Value','Unit','Period','Source ID','Source URL','Grade','Completeness','Accessed','Notes','Role','Original code','Original ID','Mapping basis','Audit note','Sheet','Row'],...(window.filteredEvidence||D.records).map(r=>[r.dataId,r.country,r.indicatorId,r.dataPoint,r.value,r.unit,r.period,r.sourceId,r.sourceUrl,r.grade,r.completeness,r.accessed,r.notes,r.role,r.originalCode,r.originalDataId,r.mappingBasis,r.auditNote,r.sheet,r.row])])}
function exportCoverageCSV(){downloadCSV('aviation-evidence-coverage.csv',[['Indicator ID','Indicator','Pillar','Core',...D.countries.map(c=>c.code)],...D.coverage.map(i=>[i.id,i.name,i.pillar,i.core,...D.countries.map(c=>{let st=cellState(c.name,i);return st.label})])])}
function exportCountryCSV(name){let rows=D.records.filter(r=>r.country===name);downloadCSV(name.toLowerCase().replace(/[^a-z]+/g,'-')+'-evidence.csv',[['Data ID','Indicator ID','Data point','Value','Unit','Period','Source ID','Source URL','Grade','Completeness','Accessed','Notes','Role','Sheet','Row'],...rows.map(r=>[r.dataId,r.indicatorId,r.dataPoint,r.value,r.unit,r.period,r.sourceId,r.sourceUrl,r.grade,r.completeness,r.accessed,r.notes,r.role,r.sheet,r.row])])}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2800)}
function filterSource(){go('sources')}
function exportData(){downloadCSV('aviation-evidence.csv',[['Data ID','Country','Indicator','Value','Grade','Role'],...D.records.map(r=>[r.dataId,r.country,r.indicatorId,r.value,r.grade,r.role])])}
function init(){mkNav();overview();profile();compare();indicators();matrix();evidence();sources();review();requests();methodology();importPage();document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value;go('evidence');document.getElementById('evSearch').value=q;filterEvidence()}})}init();
